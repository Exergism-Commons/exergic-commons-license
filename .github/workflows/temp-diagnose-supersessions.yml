name: Temporary diagnose PR 256 post-v49 fixtures

on:
  push:
    branches:
      - agent/canonical-entity-dossiers-main-integration
    paths:
      - '.github/workflows/temp-diagnose-supersessions.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Locate hard-coded v50 assumptions
        run: |
          set -euo pipefail
          git grep -n -E 'v50|version.*50|FROZEN_FINAL_VERSION' -- tests tools .github/workflows || true
