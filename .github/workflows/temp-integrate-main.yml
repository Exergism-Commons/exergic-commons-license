name: Temporary integrate main into PR 256

on:
  push:
    branches:
      - agent/canonical-entity-dossiers-main-integration
    paths:
      - '.github/workflows/temp-integrate-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/canonical-entity-dossiers-main-integration

      - name: Merge current main, preferring final #255 hunks on textual conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already integrated"
            exit 0
          fi
          git merge --no-ff -X theirs origin/main -m "Merge main after #255 into PR #256 integration"
          git status --short
          git push origin HEAD:agent/canonical-entity-dossiers-main-integration
