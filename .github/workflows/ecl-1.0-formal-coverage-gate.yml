name: ECL 1.0 formal coverage release gate

on:
  push:
    tags:
      - "v1.0*"
      - "1.0*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-ontology.txt -r tools/schedule-requirements.txt
      - name: Require every material governance dependency to be governance-ready
        run: python tools/report_exergism_coverage.py --release-1-0-gate --json build/exergism-coverage-release.json
