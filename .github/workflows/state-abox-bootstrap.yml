name: State ABox bootstrap

on:
  push:
    branches: [feat/migrate-195-state-abox]
    paths:
      - "tools/migrate_state_abox.py"
      - ".github/workflows/state-abox-bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/migrate_state_abox.py"
      - ".github/workflows/state-abox-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate all State ABox identity records
        run: python tools/migrate_state_abox.py --summary /tmp/state-abox-summary.json
      - name: Assert protected governance/legal artifacts are untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- dossiers schedules registry LICENSE versions/licenses)"
      - name: Commit generated ABox corpus to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/entities knowledge/generated
          if git diff --cached --quiet; then
            echo "State ABox corpus already current"
            exit 0
          fi
          git commit -m "Generate 195 State ABox records"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
