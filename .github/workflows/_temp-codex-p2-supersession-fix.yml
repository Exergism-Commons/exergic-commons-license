name: Temporary Codex P2 supersession fix

on:
  push:
    branches:
      - agent/canonical-entity-dossiers
    paths:
      - .github/workflows/_temp-codex-p2-supersession-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-entity-dossiers
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fix and remove temporary scaffolding
        run: |
          python tools/_temp_apply_codex_p2_supersession_fix.py
          git rm tools/_temp_apply_codex_p2_supersession_fix.py .github/workflows/_temp-codex-p2-supersession-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/entity_identity_resolution.py tools/check_canonical_entity_dossiers.py tools/check_canonical_entity_migration_preservation.py tools/check_canonical_entity_migration_preservation_extended.py tests/test_canonical_entity_dossier_supersession_history.py
          git commit -m "Fix supersession contract across canonical validators"
          git push origin HEAD:agent/canonical-entity-dossiers
