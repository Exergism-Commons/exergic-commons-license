name: State ABox v2 bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/migrate_state_abox.py"
      - ".github/workflows/state-abox-v2-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade generated State records without inventing review due dates
        run: python tools/migrate_state_abox.py --summary /tmp/state-abox-summary.json
      - name: Assert protected governance/legal artifacts are untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- dossiers schedules registry LICENSE versions/licenses)"
      - name: Commit regenerated State ABox corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/entities knowledge/generated/state-abox-manifest.json
          if git diff --cached --quiet; then
            echo "State ABox corpus already current"
            exit 0
          fi
          git commit -m "Remove synthetic manual State review due dates"
          git push origin HEAD:${{ github.head_ref }}
