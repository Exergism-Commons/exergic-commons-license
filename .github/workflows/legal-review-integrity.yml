name: Legal review gate integrity

on:
  push:
    paths:
      - "reviews/legal/**"
      - "schemas/legal-review-record.schema.json"
      - "schemas/bundle.schema.json"
      - "spec/LEGAL-ADVERSARIAL-REVIEW.md"
      - "spec/VERSIONING.md"
      - "tools/ecl_resolve.py"
      - "tools/prepare_legal_review.py"
      - "tests/test_ecl_resolve.py"
      - "tests/test_prepare_legal_review*.py"
      - ".github/workflows/legal-review-integrity.yml"
  pull_request:
    paths:
      - "reviews/legal/**"
      - "schemas/legal-review-record.schema.json"
      - "schemas/bundle.schema.json"
      - "spec/LEGAL-ADVERSARIAL-REVIEW.md"
      - "spec/VERSIONING.md"
      - "tools/ecl_resolve.py"
      - "tools/prepare_legal_review.py"
      - "tests/test_ecl_resolve.py"
      - "tests/test_prepare_legal_review*.py"
      - ".github/workflows/legal-review-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test legal review snapshot preparation
        run: python -m unittest discover -s tests -p 'test_prepare_legal_review*.py'

      - name: Test operative Bundle legal-review gate
        run: python -m unittest discover -s tests -p 'test_ecl_resolve.py'
