name: Temporary validate PR 256 against main

on:
  push:
    branches:
      - agent/canonical-entity-dossiers-main-integration
    paths:
      - '.github/workflows/temp-validate-pr256-main-base.yml'

permissions:
  contents: read

jobs:
  main-base:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: c1462fb3efcfe03cf0cb5085a10bc3a96a3ea452
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install canonical validators
        run: python -m pip install "jsonschema>=4.26.0,<5" "Pillow>=11.3.0,<12" "markdown-it-py>=4.0.0,<5"
      - name: Prove comparison base is current main ancestor
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base HEAD "${BASE_SHA}")" = "${BASE_SHA}"
      - name: Run complete canonical PR surface against main
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_canonical_entity_dossier_*.py' -v
          python tools/check_canonical_entity_manifest_schema.py
          python tools/check_canonical_entity_provenance_snapshot.py --base-ref "${BASE_SHA}"
          python tools/check_canonical_entity_manifest_history.py --base-ref "${BASE_SHA}"
          python tools/check_evidence_image_metadata.py
          python tools/check_canonical_entity_contract_round6.py
          mkdir -p build
          python tools/check_canonical_entity_dossiers_extended.py --json build/canonical-main-base-coverage.json
          python tools/check_canonical_dossier_accessibility.py
          python tools/check_visual_evidence_semantics_live.py
          python tools/check_canonical_entity_migration_preservation_extended.py --base-ref "${BASE_SHA}"
          python tools/check_dossier_visual_layout.py dossiers/assets/generated
          rm -rf build/generated-main-base build/generated-main-base.first
          python tools/render_dossier_visuals.py --out build/generated-main-base
          diff -ru dossiers/assets/generated build/generated-main-base
          python tools/check_dossier_visual_layout.py build/generated-main-base
          cp -R build/generated-main-base build/generated-main-base.first
          rm -rf build/generated-main-base
          python tools/render_dossier_visuals.py --out build/generated-main-base
          diff -ru build/generated-main-base.first build/generated-main-base
