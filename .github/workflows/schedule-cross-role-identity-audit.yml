name: Schedule cross-role identity audit

on:
  pull_request:
    paths:
      - "knowledge/entities/**"
      - "knowledge/generated/**"
      - "registry/schedule-state-s-freezes/**"
      - "tools/**"
      - ".github/workflows/schedule-cross-role-identity-audit.yml"
  push:
    paths:
      - "knowledge/entities/**"
      - "knowledge/generated/**"
      - "registry/schedule-state-s-freezes/**"
      - "tools/**"
      - ".github/workflows/schedule-cross-role-identity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Schedule parser dependency
        run: python -m pip install -r tools/schedule-requirements.txt
      - name: Self-test cross-role Schedule guards
        run: |
          python tools/check_json_duplicate_keys.py --self-test
          python tools/check_schedule_project_cross_role_identity_coverage.py --self-test
          python tools/check_schedule_short_acronym_cluster_coverage.py --self-test
          python tools/check_schedule_parenthesized_actor_capacity.py --self-test
          python tools/check_schedule_root_and_actor_alternative_identity_coverage.py --self-test
          python tools/check_schedule_actor_expression_completeness.py --self-test
          python tools/check_schedule_capacity_actor_comma_coverage.py --self-test
      - name: Enforce JSON duplicate-key integrity
        run: python tools/check_json_duplicate_keys.py
      - name: Enforce project cross-role identity coverage
        run: python tools/check_schedule_project_cross_role_identity_coverage.py
      - name: Enforce short slash-acronym review coverage
        run: python tools/check_schedule_short_acronym_cluster_coverage.py
      - name: Enforce parenthesized actor-capacity completeness
        run: python tools/check_schedule_parenthesized_actor_capacity.py
      - name: Enforce root and actor-alternative identity coverage
        run: python tools/check_schedule_root_and_actor_alternative_identity_coverage.py
      - name: Enforce fail-closed actor-expression completeness
        run: python tools/check_schedule_actor_expression_completeness.py
      - name: Enforce protected capacity-list actor completeness
        run: python tools/check_schedule_capacity_actor_comma_coverage.py
