name: Schedule integrity

on:
  push:
    paths:
      - "registry/**"
      - "reviews/schedule-compatibility/**"
      - "tools/render_schedule.py"
      - "tools/check_schedule_compatibility_output.py"
      - "tools/schedule-requirements.txt"
      - "tools/test_schedule_compatibility_gate.py"
      - "tools/test_schedule_yaml_key_security.py"
      - "tools/test_schedule_compatibility_pass21.py"
      - "tools/test_schedule_compatibility_pass22.py"
      - "LICENSE"
      - "versions/licenses/**"
      - ".github/workflows/schedule-integrity.yml"
  pull_request:
    paths:
      - "registry/**"
      - "reviews/schedule-compatibility/**"
      - "tools/render_schedule.py"
      - "tools/check_schedule_compatibility_output.py"
      - "tools/schedule-requirements.txt"
      - "tools/test_schedule_compatibility_gate.py"
      - "tools/test_schedule_yaml_key_security.py"
      - "tools/test_schedule_compatibility_pass21.py"
      - "tools/test_schedule_compatibility_pass22.py"
      - "LICENSE"
      - "versions/licenses/**"
      - ".github/workflows/schedule-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check -r tools/schedule-requirements.txt

      - name: Test compatibility gate regressions
        run: |
          python tools/test_schedule_compatibility_gate.py
          python tools/test_schedule_yaml_key_security.py
          python tools/test_schedule_compatibility_pass21.py
          python tools/test_schedule_compatibility_pass22.py

      - name: Validate frozen Schedule inputs
        run: python tools/render_schedule.py --validate-only

      - name: Render generated candidate
        run: python tools/render_schedule.py --output build/ECL-RP-0.5-GENERATED-DRAFT.md

      - name: Basic generated-artifact checks
        run: |
          test -s build/ECL-RP-0.5-GENERATED-DRAFT.md
          grep -q "NON-OPERATIVE GENERATED CANDIDATE" build/ECL-RP-0.5-GENERATED-DRAFT.md
          grep -q "State apparatus entries — R" build/ECL-RP-0.5-GENERATED-DRAFT.md
          grep -q "Direct Restricted Projects" build/ECL-RP-0.5-GENERATED-DRAFT.md

      - name: Validate rendered compatibility state
        run: python tools/check_schedule_compatibility_output.py build/ECL-RP-0.5-GENERATED-DRAFT.md

      - uses: actions/upload-artifact@v4
        with:
          name: ecl-schedule-generated-draft
          path: build/ECL-RP-0.5-GENERATED-DRAFT.md
          if-no-files-found: error
