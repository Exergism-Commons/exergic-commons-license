name: Schedule release readiness

on:
  push:
    paths:
      - "registry/**"
      - "reviews/schedule-compatibility/**"
      - "tools/render_schedule.py"
      - "tools/render_schedule_impl.py"
      - "tools/check_schedule_compatibility_output.py"
      - "tools/schedule-requirements.txt"
      - "tools/test_schedule_compatibility_gate.py"
      - "tools/test_schedule_yaml_key_security.py"
      - "tools/test_schedule_compatibility_pass21.py"
      - "tools/test_schedule_compatibility_pass22.py"
      - "tools/test_schedule_compatibility_pass23.py"
      - "tools/test_schedule_compatibility_pass24.py"
      - "tools/test_schedule_compatibility_pass25.py"
      - "tools/test_schedule_compatibility_pass26.py"
      - "tools/test_schedule_compatibility_pass27.py"
      - "LICENSE"
      - "versions/licenses/**"
      - ".github/workflows/schedule-release-readiness.yml"
  pull_request:
    paths:
      - "registry/**"
      - "reviews/schedule-compatibility/**"
      - "tools/render_schedule.py"
      - "tools/render_schedule_impl.py"
      - "tools/check_schedule_compatibility_output.py"
      - "tools/schedule-requirements.txt"
      - "tools/test_schedule_compatibility_gate.py"
      - "tools/test_schedule_yaml_key_security.py"
      - "tools/test_schedule_compatibility_pass21.py"
      - "tools/test_schedule_compatibility_pass22.py"
      - "tools/test_schedule_compatibility_pass23.py"
      - "tools/test_schedule_compatibility_pass24.py"
      - "tools/test_schedule_compatibility_pass25.py"
      - "tools/test_schedule_compatibility_pass26.py"
      - "tools/test_schedule_compatibility_pass27.py"
      - "LICENSE"
      - "versions/licenses/**"
      - ".github/workflows/schedule-release-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -I -m pip install --disable-pip-version-check -r tools/schedule-requirements.txt
      - name: Test compatibility gate regressions
        run: |
          python -I tools/test_schedule_compatibility_gate.py
          python -I tools/test_schedule_yaml_key_security.py
          python -I tools/test_schedule_compatibility_pass21.py
          python -I tools/test_schedule_compatibility_pass22.py
          python -I tools/test_schedule_compatibility_pass23.py
          python -I tools/test_schedule_compatibility_pass24.py
          python -I tools/test_schedule_compatibility_pass25.py
          python -I tools/test_schedule_compatibility_pass26.py
          python -I tools/test_schedule_compatibility_pass27.py
      - name: Validate State coverage
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import yaml
          R=Path('registry')
          def load(p): return yaml.safe_load(Path(p).read_text()) or {}
          outcomes={}
          for tier,states in load(R/'states.yml').get('outcomes',{}).items():
              for s in states: outcomes[s]=tier
          for p in sorted(R.glob('state-outcome-overrides*.yml')):
              for s,v in load(p).get('overrides',{}).items(): outcomes[s]=v['to']
          active_s={s for s,t in outcomes.items() if t=='S'}
          active_r={s for s,t in outcomes.items() if t=='R'}
          ready=set()
          for p in (R/'schedule-state-s-freezes').glob('*.yml'):
              d=load(p); recs=d.get('records') if isinstance(d.get('records'),list) else [d] if d.get('state') else []
              for rec in recs:
                  if rec.get('state') in active_s and str(rec.get('schedule_status','')).startswith('ready'):
                      ready.add(rec['state'])
          e=load(R/'schedule-progress-overrides.yml')['state_schedule_progress']
          assert len(active_r)==e['R_candidates']
          assert len(active_s)==e['S_candidates_active']
          assert len(ready)==e['S_schedule_renderable_states'], (len(ready), sorted(ready))
          assert len(active_s-ready)==e['S_current_status_or_remediation_review'], sorted(active_s-ready)
          assert e['S_identity_or_project_freeze_pending']==0
          print(f"coverage valid: R={len(active_r)} S={len(active_s)} renderable={len(ready)} factual_gate={len(active_s-ready)}")
          PY
      - name: Validate renderer
        run: python -I -S tools/render_schedule.py --validate-only
      - name: Render candidate
        run: python -I -S tools/render_schedule.py --output build/ECL-RP-0.5-GENERATED-DRAFT.md
      - name: Validate rendered compatibility state
        run: python -I tools/check_schedule_compatibility_output.py build/ECL-RP-0.5-GENERATED-DRAFT.md
      - uses: actions/upload-artifact@v7
        with:
          name: ecl-rp-0.5-generated-draft
          path: build/ECL-RP-0.5-GENERATED-DRAFT.md
          if-no-files-found: error
