name: Temporary migrate post-255 canonical identities

on:
  push:
    branches:
      - agent/canonical-entity-dossiers-main-integration
    paths:
      - '.github/workflows/temp-migrate-post255-identities.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install canonical validators
        run: python -m pip install "jsonschema>=4.26.0,<5" "Pillow>=11.3.0,<12" "markdown-it-py>=4.0.0,<5"
      - name: Materialize exactly the post-255 missing dedicated dossiers
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os, posixpath, re
          from pathlib import Path

          root = Path('.')
          expected = {
              'PERSON-AZE-ANAR-MAMMADLI','PERSON-BEN-HUGUES-COMLAN-SOSSOUKPE','PERSON-BEN-JULIEN-KANDE-KANSOU',
              'PERSON-BTN-CHATUR-MAN-TAMANG','PERSON-BTN-HASTA-BAHADUR-RAI','PERSON-CMR-DORGELESSE-NGUESSAN',
              'PERSON-CMR-MARTINEZ-ZOGO','PERSON-DZA-BOUALEM-SANSAL','PERSON-ETH-MILLION-BEYENE',
              'PERSON-GNQ-ANACLETO-MICHA-NDONG-NLANG','PERSON-GNQ-JOAQUIN-ELO-AYETO','PERSON-GTM-HECTOR-CHACLAN',
              'PERSON-GTM-LUIS-PACHECO','PERSON-JOR-AYMAN-SANDUKA','PERSON-LAO-SISAY-LUANGMONDA',
              'PERSON-LSO-TSOLO-THAKELI','PERSON-MLI-MOUSSA-MARA','PERSON-MMR-AUNG-SAN-SUU-KYI',
              'PERSON-PHL-RODRIGO-DUTERTE','PERSON-RWA-VICTOIRE-INGABIRE','PERSON-SGP-JAY-ISH-HAQ-RAJOO',
              'PERSON-SGP-KOKILA-ANNAMALAI','PERSON-SOM-SADIA-MOALIM-ALI','PERSON-THA-PAUL-CHAMBERS',
              'PERSON-TJK-BUZURGHMEHR-YOROV','PERSON-TUR-ESRA-ISIK','PERSON-TUR-HALIME-SAMAN',
              'PERSON-UGA-SARAH-BIREETE','PROJECT-BRA-OPERACAO-CONTENCAO-2025-10-28',
          }
          type_dirs = {'Person':'persons','Project':'projects'}
          manifest_path = root / 'knowledge/generated/canonical-entity-dossier-migration-v50.json'
          if manifest_path.exists():
              raise SystemExit('v50 already exists; refuse to overwrite append-only history')

          def frontmatter(path: Path) -> dict[str,str]:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{path}: missing canonical frontmatter')
              end = text.find('\n---\n', 4)
              if end < 0:
                  raise SystemExit(f'{path}: unterminated frontmatter')
              out = {}
              for line in text[4:end].splitlines():
                  if ':' in line:
                      k,v = line.split(':',1)
                      out[k.strip()] = v.strip().strip('"').strip("'")
              return out

          found = set()
          rows = []
          dossier_field_re = re.compile(r'("dossier"\s*:\s*)"(?:\\.|[^"\\])*"')
          for entity_path in sorted((root/'knowledge/entities').rglob('*')):
              if not entity_path.is_file() or entity_path.suffix.lower() not in {'.json','.jsonld'}:
                  continue
              text = entity_path.read_text(encoding='utf-8')
              record = json.loads(text)
              entity_id = record.get('id')
              if entity_id not in expected:
                  continue
              found.add(entity_id)
              entity_type = record.get('type')
              if entity_type not in type_dirs:
                  raise SystemExit(f'{entity_id}: unexpected type {entity_type!r}')
              name = record.get('name')
              if not isinstance(name,str) or not name.strip():
                  raise SystemExit(f'{entity_id}: missing name')
              raw_source = record.get('dossier')
              if not isinstance(raw_source,str):
                  raise SystemExit(f'{entity_id}: missing source dossier pointer')
              source_repo = posixpath.normpath(posixpath.join(entity_path.parent.as_posix(), raw_source.replace('\\','/')))
              m = re.fullmatch(r'dossiers/states/([A-Z]{3})\.md', source_repo)
              if not m:
                  raise SystemExit(f'{entity_id}: expected State source pointer, got {source_repo!r}')
              state = m.group(1)
              state_path = root/source_repo
              state_fm = frontmatter(state_path)
              state_context = state_fm.get('provisional_outcome')
              if state_context not in {'R','S','U','N'}:
                  raise SystemExit(f'{entity_id}: invalid current State context {state_context!r}')

              prefix = entity_type.upper() + '-'
              if not entity_id.startswith(prefix):
                  raise SystemExit(f'{entity_id}: type/id prefix mismatch')
              slug = entity_id[len(prefix):]
              dossier_rel = f'dossiers/{type_dirs[entity_type]}/{slug}.md'
              dossier_path = root/dossier_rel
              if dossier_path.exists():
                  raise SystemExit(f'{entity_id}: target dossier already exists unexpectedly: {dossier_rel}')
              dossier_path.parent.mkdir(parents=True, exist_ok=True)
              evidence_cutoff = record.get('lastSubstantiveReview')
              if not isinstance(evidence_cutoff,str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}', evidence_cutoff):
                  evidence_cutoff = '2026-09-08'
              quoted_name = json.dumps(name, ensure_ascii=False)
              lower_type = entity_type.lower()
              dossier_text = f'''---
id: ECL-{entity_id}
entity: {quoted_name}
entity_type: {lower_type}
jurisdiction: {state}
evidence_cutoff: {evidence_cutoff}
last_reviewed: 2026-09-08
review_stage: canonical-entity-dossier-v50
operative: false
---
# {name}

> **Canonical per-entity evidence/provenance record.** This dossier has no licensing effect by itself and carries no standalone `provisional_outcome`.

## Identity scope

{name} is preserved here only as the canonical {lower_type} identity already present in the ABox at the comparison base. This migration creates a dedicated identity boundary; it does not add relationships, attribution, participation, culpability or governance semantics.

## State governance context

The canonical `{state}` State dossier remains the provenance context for this identity. The status card below is generated from the current State dossier at render time. State governance is context only and is not inherited by {name}.

![State dossier context for {name}](../assets/generated/{entity_id}-status.svg)

## Evidence record

At the comparison base, the existing ABox record for `{entity_id}` pointed to `{source_repo}`. This v50 migration changes only that dossier pointer so the already-reviewed identity has its own canonical evidence/provenance surface.

## Attribution and exclusions

Identity materialization does not establish operation, control, supply, command, participation, culpability, Material Participation or any ECL governance outcome. Those propositions require separate reviewed evidence.

## Visual evidence

![Derived evidence diagram for {name}](../assets/generated/{entity_id}-evidence.svg)

The diagram represents the repository-local State-dossier provenance, the dedicated identity record and the explicit non-inference boundary. Its textual equivalent is preserved in this dossier.

## Evidence gaps

This migration adds no new external factual proposition and does not expand the evidentiary scope of the existing ABox review record. Any conduct, relationship or project-specific attribution remains outside this identity-only migration unless separately curated.

## Sources

- [Canonical {state} State dossier](../states/{state}.md)

## Governance boundary

A dedicated dossier makes the identity auditable; it does not make the identity governed, restricted, responsible for adjacent conduct or a participant in any project merely because it appears in State-context evidence.
'''
              dossier_path.write_text(dossier_text, encoding='utf-8')

              desired_pointer = Path(os.path.relpath(dossier_path, entity_path.parent)).as_posix()
              updated, count = dossier_field_re.subn(lambda mm: f'{mm.group(1)}{json.dumps(desired_pointer)}', text, count=1)
              if count != 1:
                  raise SystemExit(f'{entity_id}: expected exactly one dossier field')
              after = json.loads(updated)
              before_cmp = dict(record); after_cmp = dict(after)
              before_cmp.pop('dossier',None); after_cmp.pop('dossier',None)
              if before_cmp != after_cmp:
                  raise SystemExit(f'{entity_id}: non-dossier ABox field changed')
              entity_path.write_text(updated, encoding='utf-8')

              rows.append({
                  'id': entity_id,
                  'name': name,
                  'type': entity_type,
                  'state': state,
                  'stateContext': state_context,
                  'dossier': dossier_rel,
                  'sourceDossier': source_repo,
                  'sourceGranularity': 'partial',
                  'visualModel': {
                      'source': f'{state} State dossier + existing ABox identity/review record',
                      'proposition': f'Dedicated dossier migration preserves {name} as an identity-only non-State record',
                      'boundary': 'Identity and State-context adjacency do not establish participation, control, culpability or governance',
                  },
                  'visuals': [
                      f'dossiers/assets/generated/{entity_id}-status.svg',
                      f'dossiers/assets/generated/{entity_id}-evidence.svg',
                  ],
              })

          if found != expected:
              raise SystemExit(f'expected/found identity mismatch; missing={sorted(expected-found)} extra={sorted(found-expected)}')
          if len(rows) != 29:
              raise SystemExit(f'expected 29 rows, got {len(rows)}')
          rows.sort(key=lambda row: row['id'])
          manifest = {
              'version': 50,
              'date': '2026-09-08',
              'purpose': 'Post-#255 canonical dossier migration for identities added by the final State-dossier completeness scale-out.',
              'migrationRule': 'Existing non-State identities retain their immutable ABox semantics; this tranche changes only dossier placement from the comparison-base State dossier to a dedicated type-appropriate canonical dossier.',
              'visualRule': 'Derived visuals expose live State context and an identity-boundary evidence flow; State context never becomes entity-level governance.',
              'maxMissingDedicatedDossiers': 0,
              'entities': rows,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'generated v50 rows: {len(rows)}')
          PY

      - name: Make the synthetic post-v49 E2E fixture version-independent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_canonical_entity_dossier_full_pipeline_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = '''            base = self.git(root, "rev-parse", "HEAD")\n\n            state, state_context = self.choose_state(root)\n'''
          new = '''            base = self.git(root, "rev-parse", "HEAD")\n            existing_versions = [\n                int(path.stem.rsplit("v", 1)[1])\n                for path in (root / "knowledge/generated").glob("canonical-entity-dossier-migration-v*.json")\n            ]\n            fixture_version = max(existing_versions, default=49) + 1\n\n            state, state_context = self.choose_state(root)\n'''
          if text.count(old) != 1:
              raise SystemExit('could not locate E2E base/version insertion point')
          text = text.replace(old, new, 1)
          text = text.replace('review_stage: canonical-entity-dossier-v50-e2e', 'review_stage: canonical-entity-dossier-v{fixture_version}-e2e', 1)
          text = text.replace('                "version": 50,', '                "version": fixture_version,', 1)
          old_path = '''                / "canonical-entity-dossier-migration-v50.json"\n'''
          new_path = '''                / f"canonical-entity-dossier-migration-v{fixture_version}.json"\n'''
          if text.count(old_path) != 1:
              raise SystemExit('could not locate E2E manifest path')
          text = text.replace(old_path, new_path, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tests/test_canonical_entity_dossier_full_pipeline_e2e.py

      - name: Render complete deterministic visual set
        run: |
          rm -rf build/post255-generated
          python tools/render_dossier_visuals.py --out build/post255-generated
          rsync -a --delete build/post255-generated/ dossiers/assets/generated/

      - name: Validate generated tranche before committing
        run: |
          set -euo pipefail
          python tools/check_canonical_entity_manifest_schema.py
          python tools/check_canonical_entity_manifest_history.py
          python tools/check_canonical_entity_provenance_snapshot.py
          python tools/check_canonical_entity_contract_round6.py
          python tools/check_canonical_entity_dossiers_extended.py --json build/post255-coverage.json
          python tools/check_canonical_dossier_accessibility.py
          python tools/check_visual_evidence_semantics_live.py
          python tools/check_dossier_visual_layout.py dossiers/assets/generated
          rm -rf build/post255-regenerated
          python tools/render_dossier_visuals.py --out build/post255-regenerated
          diff -ru dossiers/assets/generated build/post255-regenerated
          python -m unittest tests.test_canonical_entity_dossier_full_pipeline_e2e -v
          python -m unittest tests.test_canonical_entity_dossier_round6_full_pipeline -v

      - name: Commit staged migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/entities knowledge/generated/canonical-entity-dossier-migration-v50.json dossiers tests/test_canonical_entity_dossier_full_pipeline_e2e.py
          git status --short
          git commit -m 'Migrate post-255 identities to canonical dossiers'
          git push origin HEAD:agent/canonical-entity-dossiers-main-integration
