name: Temporary apply PR 256 supersession compatibility

on:
  push:
    branches:
      - agent/canonical-entity-dossiers-main-integration
    paths:
      - '.github/workflows/temp-migrate-post255-identities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch canonical guards for immutable superseded history
        run: |
          set -euo pipefail
          python tools/temp_patch_pr256_supersession_compat.py
          python -m py_compile tools/check_canonical_entity_dossiers.py tools/check_canonical_entity_migration_preservation.py
      - name: Commit guard compatibility
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check_canonical_entity_dossiers.py tools/check_canonical_entity_migration_preservation.py
          git diff --cached --check
          git commit -m 'Honor identity supersessions in canonical dossier history'
          git push origin HEAD:agent/canonical-entity-dossiers-main-integration
