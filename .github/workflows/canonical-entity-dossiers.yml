name: Canonical entity dossiers

on:
  push:
    paths:
      - 'dossiers/**'
      - 'knowledge/entities/**'
      - 'knowledge/generated/canonical-entity-dossier-migration-*.json'
      - 'knowledge/generated/dossier-visual-palette-*.json'
      - 'spec/VISUAL-EVIDENCE.md'
      - 'schemas/evidence-image-metadata.schema.json'
      - 'tools/check_canonical_entity_dossiers.py'
      - 'tools/check_dossier_visual_layout.py'
      - 'tools/render_dossier_visuals.py'
      - '.github/workflows/canonical-entity-dossiers.yml'
  pull_request:
    paths:
      - 'dossiers/**'
      - 'knowledge/entities/**'
      - 'knowledge/generated/canonical-entity-dossier-migration-*.json'
      - 'knowledge/generated/dossier-visual-palette-*.json'
      - 'spec/VISUAL-EVIDENCE.md'
      - 'schemas/evidence-image-metadata.schema.json'
      - 'tools/check_canonical_entity_dossiers.py'
      - 'tools/check_dossier_visual_layout.py'
      - 'tools/render_dossier_visuals.py'
      - '.github/workflows/canonical-entity-dossiers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-dossiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize conservative visual wrapping
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/canonical-entity-dossiers'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/render_dossier_visuals.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'max_width=EVIDENCE_TEXT_BUDGETS["source"], font_size=15,\n        max_lines=3, line_height=20': 'max_width=EVIDENCE_TEXT_BUDGETS["source"], font_size=14,\n        max_lines=3, line_height=19',
              'max_width=EVIDENCE_TEXT_BUDGETS["proposition"], font_size=15,\n        max_lines=3, line_height=20': 'max_width=EVIDENCE_TEXT_BUDGETS["proposition"], font_size=14,\n        max_lines=3, line_height=19',
              'max_width=EVIDENCE_TEXT_BUDGETS["identity"], font_size=15,\n        max_lines=3, line_height=20': 'max_width=EVIDENCE_TEXT_BUDGETS["identity"], font_size=14,\n        max_lines=3, line_height=19',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python tools/render_dossier_visuals.py --out dossiers/assets/generated
          if ! git diff --quiet -- tools/render_dossier_visuals.py dossiers/assets/generated; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/render_dossier_visuals.py dossiers/assets/generated
            git commit -m 'Fit full evidence text within safe gutters'
            git push origin HEAD:agent/canonical-entity-dossiers
          fi

      - name: Validate canonical per-entity dossier ratchet
        run: |
          mkdir -p build
          python tools/check_canonical_entity_dossiers.py --json build/canonical-entity-dossier-coverage.json

      - name: Validate committed visual layout bounds
        run: python tools/check_dossier_visual_layout.py dossiers/assets/generated

      - name: Regenerate derived visuals
        run: |
          rm -rf build/generated-visuals
          python tools/render_dossier_visuals.py --out build/generated-visuals
          diff -ru dossiers/assets/generated build/generated-visuals

      - name: Validate regenerated visual layout bounds
        run: python tools/check_dossier_visual_layout.py build/generated-visuals

      - name: Prove deterministic visual generation
        run: |
          cp -R build/generated-visuals build/generated-visuals.first
          rm -rf build/generated-visuals
          python tools/render_dossier_visuals.py --out build/generated-visuals
          diff -ru build/generated-visuals.first build/generated-visuals

      - name: Upload dossier coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-entity-dossier-coverage
          path: |
            build/canonical-entity-dossier-coverage.json
            build/generated-visuals/
          if-no-files-found: error
