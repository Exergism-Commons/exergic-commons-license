name: Exergism analysis integrity

on:
  push:
    paths:
      - "spec/EXERGIC-ANALYSIS.md"
      - "exergism/**"
      - "tools/exergic_analysis.py"
      - "tests/test_exergic_analysis.py"
      - "tests/test_exergism_upstream.py"
      - ".github/workflows/exergism-analysis.yml"
  pull_request:
    paths:
      - "spec/EXERGIC-ANALYSIS.md"
      - "exergism/**"
      - "tools/exergic_analysis.py"
      - "tests/test_exergic_analysis.py"
      - "tests/test_exergism_upstream.py"
      - ".github/workflows/exergism-analysis.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest tests/test_exergic_analysis.py tests/test_exergism_upstream.py
      - name: Validate all committed assessments against every pinned upstream context
        shell: bash
        run: |
          set -euo pipefail
          profiles=(
            exergism/profiles/upstream-transition-v0.1.0.json
            exergism/profiles/upstream-liberated-society-v0.1.0.json
            exergism/profiles/upstream-mundane-interaction-v0.1.0.json
          )
          for assessment in exergism/assessments/*.json; do
            for profile in "${profiles[@]}"; do
              echo "checking ${assessment} with ${profile}"
              python tools/exergic_analysis.py "${assessment}" --profile "${profile}" --pretty >/dev/null
            done
          done
