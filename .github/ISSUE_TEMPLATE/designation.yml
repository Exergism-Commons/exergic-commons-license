name: Restricted Party proposal
description: Propose a new ECL designation or scope expansion
title: "Designation: "
body:
  - type: input
    id: entity
    attributes:
      label: Exact entity or project
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: ECL criteria and material conduct
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Prefer primary, judicial, official or independently verifiable sources.
    validations:
      required: true
  - type: textarea
    id: contrary
    attributes:
      label: Counter-evidence and uncertainty
      description: Actively identify evidence capable of weakening, narrowing or defeating the proposed designation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and narrower alternatives
    validations:
      required: true
  - type: textarea
    id: conflict
    attributes:
      label: Conflict / material-interest disclosure
      description: Disclose relevant authorship, employment, financial interest, direct advocacy role or other material relationship. A conflict does not bar evidence submission but affects independent-review status.
    validations:
      required: true
