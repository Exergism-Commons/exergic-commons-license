<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Supreme Federal Court — State dossier context S</title>
  <desc id="desc">Derived status card. The BRA State dossier is S — Scoped restriction. This status is context only and is not inherited by Supreme Federal Court.</desc>
  <rect width="960" height="260" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
  <rect width="18" height="260" rx="9" fill="#E67E22"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#101828">STATE DOSSIER CONTEXT</text>
  <text x="54" y="104" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101828">Supreme Federal Court</text>
  <rect x="54" y="130" width="250" height="58" rx="12" fill="#E67E22"/>
  <text x="76" y="168" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">S · Scoped restriction</text>
  <text x="330" y="153" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#344054">BRA State dossier</text>
  <text x="330" y="181" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Context only — no entity-level governance inheritance</text>
  <line x1="54" y1="212" x2="906" y2="212" stroke="#EAECF0"/>
  <text x="54" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#667085">Color is never the sole signal: the state letter and label are always rendered.</text>
</svg>
