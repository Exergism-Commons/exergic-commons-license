<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">ECL dossier state-context palette</title>
  <desc id="desc">Canonical R, S, U, N and unknown colors. Letters and labels accompany every swatch; colors are never entity culpability scores.</desc>
  <rect width="1000" height="230" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="40" y="47" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#101828">ECL STATE-CONTEXT PALETTE</text>
  <text x="40" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#667085">Rendering vocabulary only · not a severity scale · no governance inheritance</text>
  <rect x="40" y="92" width="168" height="78" rx="12" fill="#B42318"/>
  <text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">R</text>
  <text x="58" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">Restricted</text>
  <rect x="224" y="92" width="168" height="78" rx="12" fill="#E67E22"/>
  <text x="242" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">S</text>
  <text x="242" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">Scoped restriction</text>
  <rect x="408" y="92" width="168" height="78" rx="12" fill="#D4A017"/>
  <text x="426" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">U</text>
  <text x="426" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">Under review / unresolved</text>
  <rect x="592" y="92" width="168" height="78" rx="12" fill="#2E7D32"/>
  <text x="610" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">N</text>
  <text x="610" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">No restriction</text>
  <rect x="776" y="92" width="168" height="78" rx="12" fill="#667085"/>
  <text x="794" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">UNKNOWN</text>
  <text x="794" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF">Insufficient information</text>
  <text x="40" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#667085">Always render letter + text label together with color.</text>
</svg>
