<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Human Rights Commission of Sri Lanka — State dossier context S</title>
  <desc id="desc">Derived status card. The LKA State dossier is S — Scoped restriction. This status is context only and is not inherited by Human Rights Commission of Sri Lanka.</desc>
  <defs>
    <clipPath id="status-name-clip"><rect x="54" y="64" width="800" height="66"/></clipPath>
    <clipPath id="status-badge-clip"><rect x="54" y="150" width="300" height="66" rx="12"/></clipPath>
  </defs>
  <rect width="960" height="300" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
  <rect width="18" height="300" rx="9" fill="#E67E22"/>
  <text x="54" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#344054">STATE DOSSIER CONTEXT</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828" clip-path="url(#status-name-clip)">
    <tspan x="54" y="88">Human Rights Commission of Sri Lanka</tspan>
  </text>
  <rect x="54" y="150" width="300" height="66" rx="12" fill="#E67E22"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" clip-path="url(#status-badge-clip)">
    <tspan x="76" y="177">S · Scoped restriction</tspan>
  </text>
  <text x="382" y="177" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#344054">LKA State dossier</text>
  <text x="382" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475467">Context only — no entity-level governance inheritance</text>
  <line x1="54" y1="246" x2="906" y2="246" stroke="#EAECF0"/>
  <text x="54" y="275" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#667085">Color is never the sole signal: the state letter and label are always rendered.</text>
</svg>
